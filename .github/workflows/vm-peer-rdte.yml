name: Violentmonkey Native Peer RDTE (Synthetic Only)
on:
  pull_request:
    paths:
      - 'rdte/violentmonkey-peer/**'
      - '.github/workflows/vm-peer-rdte.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pages-delivery-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compare existing public delivery with pinned Git digests
        run: node rdte/violentmonkey-peer/pages-delivery.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-delivery-readback
          path: reports/pages-delivery.json
          retention-days: 3
