name: Public model acquisition metadata baseline
on:
  pull_request:
    paths:
      - 'rdte/model-acquisition/**'
      - '.github/workflows/model-acquisition.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  anonymous-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compare public repository metadata at exact revision
        run: node rdte/model-acquisition/metadata.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-acquisition-metadata
          path: reports/model-acquisition.json
          retention-days: 3
